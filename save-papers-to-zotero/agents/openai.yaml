interface:
  display_name: "Save Papers to Zotero"
  short_description: "Batch-import papers with verified PDFs"
  default_prompt: "Use $save-papers-to-zotero to import this paper list with verified PDFs, preserve arXiv Comments, default each new item to #status/to-read, and report possible existing matches. If the user only has DOIs/arXiv IDs or a .bib file, first run the ingest resolver to produce a reviewable manifest, then import it. Before importing, confirm the target collection already exists in Zotero; the local Zotero server cannot create collections through its API, so if it is missing, ask the user to create it manually in the Zotero app and rerun."
